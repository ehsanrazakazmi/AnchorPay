[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anchorpay-ledger-service"
version = "0.1.0"
description = "Double-entry ledger, nightly reconciliation with the payout partner, balances, audit search and the daily regulatory summary (Module 3)."
requires-python = ">=3.12"
dependencies = ["anchorpay-service-kit", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]
