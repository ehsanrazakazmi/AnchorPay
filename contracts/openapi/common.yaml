openapi: 3.1.0
info:
  title: AnchorPay shared API components
  version: 1.0.0
  description: Schemas, parameters and responses shared by public-api.yaml and internal-api.yaml.
paths: {}
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Client-supplied id for tracing. Generated by the gateway when missing and echoed on every response.
      schema:
        type: string
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated UUID. Re-sending the same key with the same body returns the original result instead of
        creating a duplicate; the same key with a different body returns 409 IDEMPOTENCY_KEY_REUSED. Keys expire after 24h.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    RequestId:
      description: Request id for support and tracing.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:
    BadRequest:
      description: The request is malformed or fails validation (code VALIDATION_ERROR).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://docs.anchorpay.local/errors/validation-error
            title: Validation failed
            status: 400
            code: VALIDATION_ERROR
            detail: One or more fields are invalid.
            requestId: req_01J8Z6Q4N5
            errors:
              - field: sendAmount.amountMinor
                message: must be >= 1000
    Unauthorized:
      description: Missing, invalid or expired access token (code UNAUTHENTICATED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated but not allowed (code FORBIDDEN), e.g. wrong role or someone else's resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or is not visible to the caller (code NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The request conflicts with current state, e.g. INVALID_STATE_TRANSITION, QUOTE_EXPIRED, RATE_LOCK_EXPIRED,
        IDEMPOTENCY_KEY_REUSED, ALREADY_EXISTS.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Valid request that breaks a business rule, e.g. KYC_REQUIRED, LIMIT_EXCEEDED, CORRIDOR_UNAVAILABLE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded (code RATE_LIMITED).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServerError:
      description: Unexpected error (code INTERNAL_ERROR) or a dependency is down (SERVICE_UNAVAILABLE). Safe to retry idempotent calls.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: Error body for every non-2xx response (RFC 9457 problem details).
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          $ref: '#/components/schemas/ErrorCode'
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
        errors:
          type: array
          description: Field-level validation errors (VALIDATION_ERROR only).
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string
    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, never on title/detail text.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - NOT_FOUND
        - ALREADY_EXISTS
        - CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - INVALID_STATE_TRANSITION
        - QUOTE_EXPIRED
        - RATE_LOCK_EXPIRED
        - KYC_REQUIRED
        - LIMIT_EXCEEDED
        - CORRIDOR_UNAVAILABLE
        - PAYMENT_DECLINED
        - RATE_LIMITED
        - INVALID_SIGNATURE
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE

    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Currency:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [CAD]
    Country:
      type: string
      pattern: '^[A-Z]{2}$'
      examples: [PK]
    Money:
      type: object
      description: Amount in integer minor units (cents / paisa) — never a float.
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          examples: [50000]
        currency:
          $ref: '#/components/schemas/Currency'
    Rate:
      type: string
      description: Exchange rate as a decimal string (1 unit of send currency = rate units of receive currency).
      pattern: '^[0-9]+(\.[0-9]{1,10})?$'
      examples: ['203.5699000000']
    Percent:
      type: string
      description: Percentage as a decimal string, e.g. "1.50" = 1.5 %.
      pattern: '^[0-9]+(\.[0-9]{1,4})?$'
    CorridorCode:
      type: string
      pattern: '^[A-Z]{2}-[A-Z]{2}$'
      examples: [CA-PK]
    FundingMethod:
      type: string
      enum: [card, bank_debit]
    PayoutMethod:
      type: string
      enum: [bank_account, mobile_wallet]
    TransferPurpose:
      type: string
      enum: [family_support, education, medical, gift, savings_investment, property, business, travel, other]
    TransferStatus:
      type: string
      description: See docs/state-machine.md for the allowed transitions.
      enum:
        - INITIATED
        - FX_LOCKED
        - COMPLIANCE_SCREENING
        - ON_HOLD
        - AWAITING_RECONFIRM
        - PAYMENT_COLLECTED
        - PAYOUT_DISPATCHED
        - COMPLETED
        - FAILED
        - CANCELLED
        - REFUNDED
    TransferReference:
      type: string
      pattern: '^AP-[0-9A-Z]{8}$'
      examples: [AP-7K3F9Q2M]
    KycTier:
      type: integer
      minimum: 0
      maximum: 3
    KycStatus:
      type: string
      enum: [PENDING, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]
    Role:
      type: string
      enum: [customer, agent, compliance_officer, admin]
    PageInfo:
      type: object
      required: [page, pageSize, total]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    Quote:
      type: object
      description: >-
        Price for a transfer. Quotes are indicative and live 60 seconds; creating a transfer with a quoteId locks
        exactly this rate for 30 minutes. After expiry the client must request a new quote (rate refresh prompt).
      required: [quoteId, corridorCode, fundingMethod, sendAmount, fee, cardSurcharge, totalCharge, receiveAmount,
                 midRate, offerRate, spreadPercent, rateTimestamp, expiresAt, deliveryEstimate]
      properties:
        quoteId:
          $ref: '#/components/schemas/Uuid'
        corridorCode:
          $ref: '#/components/schemas/CorridorCode'
        fundingMethod:
          $ref: '#/components/schemas/FundingMethod'
        sendAmount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        cardSurcharge:
          $ref: '#/components/schemas/Money'
        totalCharge:
          description: What the sender pays = sendAmount + fee + cardSurcharge.
          $ref: '#/components/schemas/Money'
        receiveAmount:
          description: What the recipient gets = sendAmount x offerRate, rounded down to the minor unit.
          $ref: '#/components/schemas/Money'
        midRate:
          $ref: '#/components/schemas/Rate'
        offerRate:
          $ref: '#/components/schemas/Rate'
        spreadPercent:
          $ref: '#/components/schemas/Percent'
        rateTimestamp:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        deliveryEstimate:
          type: string
          examples: [Within minutes to 1 business day]

    PaymentAction:
      description: What the client must do to authorise the payment after creating a transfer.
      oneOf:
        - $ref: '#/components/schemas/PaymentActionNone'
        - $ref: '#/components/schemas/PaymentActionStripeCard'
        - $ref: '#/components/schemas/PaymentActionMockCard'
      discriminator:
        propertyName: type
        mapping:
          none: '#/components/schemas/PaymentActionNone'
          stripe_card: '#/components/schemas/PaymentActionStripeCard'
          mock_card: '#/components/schemas/PaymentActionMockCard'
    PaymentActionNone:
      type: object
      description: No action needed (bank debit is authorised automatically).
      required: [type]
      properties:
        type:
          type: string
          const: none
    PaymentActionStripeCard:
      type: object
      description: Confirm the card with Stripe Elements (Stripe test mode only).
      required: [type, clientSecret, publishableKey]
      properties:
        type:
          type: string
          const: stripe_card
        clientSecret:
          type: string
        publishableKey:
          type: string
    PaymentActionMockCard:
      type: object
      description: Open the mock card form (local development).
      required: [type, authorizeUrl]
      properties:
        type:
          type: string
          const: mock_card
        authorizeUrl:
          type: string
          format: uri
