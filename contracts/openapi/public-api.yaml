  /v1/kyc/submissions:
    post:
      tags: [KYC]
      operationId: startKycSubmission
      summary: Start verification for a higher tier
      x-owner-service: compliance-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier, documentType, documentCountry]
              properties:
                tier:
                  type: integer
                  enum: [2, 3]
                documentType:
                  type: string
                  enum: [drivers_licence, passport, national_id, pr_card]
                documentCountry:
                  $ref: 'common.yaml#/components/schemas/Country'
      responses:
        '201':
          description: Submission started; upload the listed documents next
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmission'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/kyc/submissions/{submissionId}:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
    get:
      tags: [KYC]
      operationId: getKycSubmission
      summary: Status of one submission
      x-owner-service: compliance-service
      x-roles: [customer]
      responses:
        '200':
          description: Submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSubmission'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/kyc/submissions/{submissionId}/documents/{kind}:
    parameters:
      - $ref: '#/components/parameters/SubmissionId'
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [id_front, id_back, selfie, proof_of_address, proof_of_income]
    put:
      tags: [KYC]
      operationId: uploadKycDocument
      summary: Upload one document image (camera capture or file)
      description: >-
        JPEG, PNG or PDF, max 10 MB. The file is forwarded straight to the KYC vendor; AnchorPay stores only the
        vendor's file reference, never the image.
      x-owner-service: compliance-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
      responses:
        '204':
          description: Uploaded
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '413':
          description: File larger than 10 MB
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

