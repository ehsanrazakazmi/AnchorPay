openapi: 3.1.0
info:
  title: AnchorPay Public API
  version: 1.0.0
  summary: Customer, staff and webhook API exposed through the API gateway.
  description: |
    All client traffic enters through the API gateway, which validates the JWT, applies rate limits,
    adds `X-Request-Id` and routes each path to the service named in `x-owner-service`.

    **Conventions** (frozen at Foundation sign-off)
    - JSON bodies use camelCase. Money is `{ amountMinor, currency }` in integer minor units; rates are decimal strings.
    - Every error is `application/problem+json` with a stable `code` (see `ErrorCode`).
    - `x-roles` lists the roles allowed to call an operation. Customers only ever see their own resources.
    - Versioning: breaking changes go to `/v2`; additive changes (new optional fields, new endpoints) stay in `/v1`.
    - Access tokens expire after 15 minutes; refresh tokens after 30 days (rotated on every refresh).
  contact:
    name: AnchorPay engineering
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:8080
    description: Local API gateway
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Auth
    description: Registration, login, tokens, verification, passwords (identity-service).
  - name: Profile
    description: The signed-in user's own profile (identity-service).
  - name: Recipients
    description: Address book of people the user sends money to (identity-service).
  - name: Pricing
    description: Corridors and quotes (fx-service).
  - name: Transfers
    description: Create, track and manage transfers (transfer-service).
  - name: KYC
    description: Identity verification (compliance-service).
  - name: Notifications
    description: SMS / email preferences (notification-service).
  - name: Admin - Compliance
    description: Review queue, KYC review, AML configuration (compliance-service). Staff only.
  - name: Admin - Reports
    description: FINTRAC report drafts and regulatory summaries. Staff only.
  - name: Admin - Operations
    description: Transfers, payouts, reconciliation, ledger, audit log, users. Staff only.
  - name: Webhooks
    description: Callbacks from payment, payout and KYC providers (signature-verified, no JWT).

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Gateway and downstream service health
      security: []
      x-owner-service: gateway
      x-roles: [public]
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        '503':
          description: One or more critical dependencies are down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  # ---------------------------------------------------------------- auth
  /v1/users:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Register a new customer account
      description: >-
        Creates a customer at KYC tier 0 and sends an email verification link and a phone code.
        Only Canadian residents can register while the send side is Canada-only.
      security: []
      x-owner-service: identity-service
      x-roles: [public]
      parameters:
        - $ref: 'common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: >-
        Returns a 15-minute access token and a 30-day refresh token. After 5 failed attempts the account is locked
        for 15 minutes (ACCOUNT_LOCKED).
      security: []
      x-owner-service: identity-service
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '423':
          description: Account temporarily locked after too many failed attempts (ACCOUNT_LOCKED).
          content:
            application/problem+json:
              schema:
                $ref: 'common.yaml#/components/schemas/Problem'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Exchange a refresh token for a new token pair
      description: The old refresh token is revoked (rotation). Re-using a revoked token revokes the whole session.
      security: []
      x-owner-service: identity-service
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh token (log out this device)
      x-owner-service: identity-service
      x-roles: [customer, agent, compliance_officer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/verify-email:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Confirm the email address with the token from the verification link
      security: []
      x-owner-service: identity-service
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '204':
          description: Email verified
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/verify-phone:
    post:
      tags: [Auth]
      operationId: verifyPhone
      summary: Confirm the phone number with the 6-digit SMS code
      x-owner-service: identity-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
      responses:
        '204':
          description: Phone verified
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/resend-verification:
    post:
      tags: [Auth]
      operationId: resendVerification
      summary: Resend the email link or SMS code
      x-owner-service: identity-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [email, phone]
      responses:
        '204':
          description: Sent (limited to 1 per minute, 5 per day)
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: Always returns 204, whether or not the email exists, so accounts can't be discovered.
      security: []
      x-owner-service: identity-service
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '204':
          description: Request accepted
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Set a new password using the reset token (valid 30 minutes, single use)
      security: []
      x-owner-service: identity-service
      x-roles: [public]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  $ref: '#/components/schemas/Password'
      responses:
        '204':
          description: Password changed; all sessions revoked
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  # ---------------------------------------------------------------- profile
  /v1/users/me:
    get:
      tags: [Profile]
      operationId: getMe
      summary: Get the signed-in user's profile
      x-owner-service: identity-service
      x-roles: [customer, agent, compliance_officer, admin]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'
    patch:
      tags: [Profile]
      operationId: updateMe
      summary: Update phone or address
      description: >-
        Name and date of birth can't be changed here because they are tied to identity verification (contact support).
        Changing the phone number requires verifying the new number.
      x-owner-service: identity-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/users/me/change-password:
    post:
      tags: [Profile]
      operationId: changePassword
      summary: Change password (requires the current password)
      x-owner-service: identity-service
      x-roles: [customer, agent, compliance_officer, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  $ref: '#/components/schemas/Password'
      responses:
        '204':
          description: Changed; other sessions revoked
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  # ---------------------------------------------------------------- recipients
  /v1/recipients:
    get:
      tags: [Recipients]
      operationId: listRecipients
      summary: List saved recipients
      x-owner-service: identity-service
      x-roles: [customer]
      responses:
        '200':
          description: Recipients (newest first)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipient'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'
    post:
      tags: [Recipients]
      operationId: createRecipient
      summary: Save a new recipient
      x-owner-service: identity-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientCreate'
      responses:
        '201':
          description: Recipient saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/recipients/{recipientId}:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    get:
      tags: [Recipients]
      operationId: getRecipient
      summary: Get one recipient
      x-owner-service: identity-service
      x-roles: [customer]
      responses:
        '200':
          description: Recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'
    patch:
      tags: [Recipients]
      operationId: updateRecipient
      summary: Update nickname, relationship or phone
      description: Payout details (bank account / wallet) are immutable — save a new recipient instead.
      x-owner-service: identity-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'
    delete:
      tags: [Recipients]
      operationId: deleteRecipient
      summary: Remove a recipient from the address book (soft delete; past transfers keep it)
      x-owner-service: identity-service
      x-roles: [customer]
      responses:
        '204':
          description: Removed
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  # ---------------------------------------------------------------- pricing
  /v1/corridors:
    get:
      tags: [Pricing]
      operationId: listCorridors
      summary: Countries/currencies you can send to, with fees and limits
      security: []
      x-owner-service: fx-service
      x-roles: [public]
      responses:
        '200':
          description: Enabled corridors
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: 'common.yaml#/components/schemas/Corridor'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/quotes:
    post:
      tags: [Pricing]
      operationId: createQuote
      summary: Price a transfer (live rate, fee, surcharge, exact amount received)
      description: >-
        Returns an indicative quote valid for 60 seconds. The UI refreshes it every 30 seconds while the user is on
        the amount screen. Anonymous users may request quotes (landing-page calculator).
      security:
        - {}
        - bearerAuth: []
      x-owner-service: fx-service
      x-roles: [public, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Quote'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  # ---------------------------------------------------------------- transfers
  /v1/transfers:
    post:
      tags: [Transfers]
      operationId: createTransfer
      summary: Confirm a transfer (locks the quoted rate for 30 minutes)
      description: |
        Flow (payment-first, rate locked immediately):
        1. Validates KYC tier and limits (422 KYC_REQUIRED / LIMIT_EXCEEDED) and that the quote is still valid (409 QUOTE_EXPIRED).
        2. Creates the transfer (INITIATED) and locks the quote's rate (FX_LOCKED).
        3. Starts a payment **authorisation** — funds are held, not charged. `paymentAction` says what the client must do.
        4. Once authorised, screening runs; on pass the held payment is captured and the payout is sent.
      x-owner-service: transfer-service
      x-roles: [customer]
      parameters:
        - $ref: 'common.yaml#/components/parameters/IdempotencyKey'
        - $ref: 'common.yaml#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '201':
          description: Transfer created and rate locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTransferResponse'
        '200':
          description: Same Idempotency-Key and body as an earlier request — the original transfer is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTransferResponse'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        '422':
          $ref: 'common.yaml#/components/responses/UnprocessableEntity'
        '429':
          $ref: 'common.yaml#/components/responses/TooManyRequests'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'
    get:
      tags: [Transfers]
      operationId: listTransfers
      summary: Transfer history with filters
      x-owner-service: transfer-service
      x-roles: [customer]
      parameters:
        - name: status
          in: query
          required: false
          description: One or more statuses (repeat the parameter).
          schema:
            type: array
            items:
              $ref: 'common.yaml#/components/schemas/TransferStatus'
          style: form
          explode: true
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: minAmountMinor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: maxAmountMinor
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - $ref: 'common.yaml#/components/parameters/Page'
        - $ref: 'common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of transfers (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPage'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/transfers/{transferId}:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Transfer details and progress timeline
      description: The tracking screen polls this every 5 seconds while the transfer is not in a final state.
      x-owner-service: transfer-service
      x-roles: [customer]
      responses:
        '200':
          description: Transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/transfers/{transferId}/cancel:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Transfers]
      operationId: cancelTransfer
      summary: Cancel a transfer before money is captured
      description: Allowed in FX_LOCKED, ON_HOLD and AWAITING_RECONFIRM. The payment hold is released.
      x-owner-service: transfer-service
      x-roles: [customer]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/transfers/{transferId}/requote:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Transfers]
      operationId: requoteTransfer
      summary: Get a fresh rate for a transfer in AWAITING_RECONFIRM
      description: The CAD amount charged stays the same; only the amount the recipient receives changes.
      x-owner-service: transfer-service
      x-roles: [customer]
      responses:
        '200':
          description: New quote to show the user
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Quote'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /v1/transfers/{transferId}/reconfirm:
    parameters:
      - $ref: '#/components/parameters/TransferId'
    post:
      tags: [Transfers]
      operationId: reconfirmTransfer
      summary: Accept the new rate and continue the transfer
      x-owner-service: transfer-service
      x-roles: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId:
                  $ref: 'common.yaml#/components/schemas/Uuid'
      responses:
        '200':
          description: Rate re-locked; payment captured and payout started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        '409':
          $ref: 'common.yaml#/components/responses/Conflict'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  # ---------------------------------------------------------------- KYC
  /v1/kyc:
    get:
      tags: [KYC]
      operationId: getKycStatus
      summary: Current KYC tier, limits and usage
      x-owner-service: compliance-service
      x-roles: [customer]
      responses:
        '200':
          description: KYC status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycOverview'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        default:
