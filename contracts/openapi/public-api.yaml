                  type: boolean
      responses:
        '200':
          description: Updated corridor
          content:
            application/json:
              schema:
                $ref: 'common.yaml#/components/schemas/Corridor'
        '400':
          $ref: 'common.yaml#/components/responses/BadRequest'
        '401':
          $ref: 'common.yaml#/components/responses/Unauthorized'
        '403':
          $ref: 'common.yaml#/components/responses/Forbidden'
        '404':
          $ref: 'common.yaml#/components/responses/NotFound'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  # ---------------------------------------------------------------- webhooks
  /webhooks/stripe:
    post:
      tags: [Webhooks]
      operationId: stripeWebhook
      summary: Stripe payment events (test mode)
      description: Verified with the Stripe-Signature header and STRIPE_WEBHOOK_SECRET. Duplicate event ids are ignored.
      security:
        - stripeSignature: []
      x-owner-service: payment-service
      x-roles: [provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
        '400':
          $ref: '#/components/responses/InvalidSignature'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /webhooks/payout-partner:
    post:
      tags: [Webhooks]
      operationId: payoutPartnerWebhook
      summary: Payout status updates (mock partner locally; Thunes/Flutterwave later)
      security:
        - providerSignature: []
      x-owner-service: payment-service
      x-roles: [provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutPartnerEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
        '400':
          $ref: '#/components/responses/InvalidSignature'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

  /webhooks/kyc-vendor:
    post:
      tags: [Webhooks]
      operationId: kycVendorWebhook
      summary: KYC verification results (mock vendor locally; Jumio/Onfido later)
      security:
        - providerSignature: []
      x-owner-service: compliance-service
      x-roles: [provider]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KycVendorEvent'
      responses:
        '200':
          $ref: '#/components/responses/WebhookAccepted'
        '400':
          $ref: '#/components/responses/InvalidSignature'
        default:
          $ref: 'common.yaml#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'RS256 access token from /v1/auth/login. Claims: sub (user id), role, sid (session id), iss, aud, exp (15 min). KYC tier is not a claim: it can change at any time, ask compliance-service.'
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
    providerSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: 'Hex HMAC-SHA256 of "<X-Timestamp>.<raw body>" with the provider webhook secret. Rejected if older than 5 minutes.'

  parameters:
    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/Uuid'
    RecipientId:
      name: recipientId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/Uuid'
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/Uuid'
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/Uuid'
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/Uuid'
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        $ref: 'common.yaml#/components/schemas/Uuid'

  responses:
    WebhookAccepted:
      description: Event received (also returned for duplicates)
      content:
        application/json:
          schema:
            type: object
            required: [received]
            properties:
              received:
                type: boolean
                const: true
    InvalidSignature:
      description: Signature missing, invalid or too old (INVALID_SIGNATURE)
      content:
        application/problem+json:
          schema:
            $ref: 'common.yaml#/components/schemas/Problem'

  schemas:
    Health:
      type: object
      required: [status, checkedAt, services]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        checkedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        services:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]

    Password:
      type: string
      minLength: 12
      maxLength: 128
      writeOnly: true
      description: At least 12 characters. Checked against a list of common/breached passwords.

    Address:
      type: object
      required: [line1, city, province, postalCode]
      properties:
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 100
        province:
          type: string
          enum: [AB, BC, MB, NB, NL, NS, NT, NU, 'ON', PE, QC, SK, YT]
        postalCode:
          type: string
          pattern: '^[A-Za-z][0-9][A-Za-z] ?[0-9][A-Za-z][0-9]$'

    RegisterRequest:
      type: object
      required: [email, phone, password, fullName, dateOfBirth, country, acceptTerms]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          description: E.164 format.
          pattern: '^\+[1-9][0-9]{7,14}$'
          examples: ['+14165550123']
        password:
          $ref: '#/components/schemas/Password'
        fullName:
          type: string
          minLength: 2
          maxLength: 150
          description: As shown on government ID.
        dateOfBirth:
          type: string
          format: date
          description: Must be 18 or older.
        address:
          $ref: '#/components/schemas/Address'
        country:
          type: string
          const: CA
        acceptTerms:
          type: boolean
          const: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, refreshExpiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          description: Seconds (900).
        refreshExpiresIn:
          type: integer
          description: Seconds (2592000).

    User:
      type: object
      required: [id, email, phone, fullName, country, role, status, emailVerified, phoneVerified, createdAt]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Uuid'
        email:
          type: string
          format: email
        phone:
          type: string
        fullName:
          type: string
        dateOfBirth:
          type: string
          format: date
        address:
          $ref: '#/components/schemas/Address'
        country:
          $ref: 'common.yaml#/components/schemas/Country'
        role:
          $ref: 'common.yaml#/components/schemas/Role'
        status:
          type: string
          enum: [active, locked, suspended, closed]
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        createdAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'

    UpdateMeRequest:
      type: object
      minProperties: 1
      properties:
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        address:
          $ref: '#/components/schemas/Address'

    Recipient:
      type: object
      required: [id, fullName, country, currency, payoutMethod, createdAt, updatedAt]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Uuid'
        nickname:
          type: string
        fullName:
          type: string
        phone:
          type: string
        country:
          $ref: 'common.yaml#/components/schemas/Country'
        currency:
          $ref: 'common.yaml#/components/schemas/Currency'
        relationship:
          type: string
        payoutMethod:
          $ref: 'common.yaml#/components/schemas/PayoutMethod'
        bankAccount:
          type: object
          required: [bankName, accountNumberMasked]
          properties:
            bankName:
              type: string
            bankCode:
              type: string
            accountNumberMasked:
              type: string
              examples: ['•••• 4521']
        mobileWallet:
          type: object
          required: [provider, walletNumberMasked]
          properties:
            provider:
              type: string
              enum: [jazzcash, easypaisa]
            walletNumberMasked:
              type: string
              examples: ['+92 3•• ••• 4521']
        createdAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        updatedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'

    RecipientCreate:
      type: object
      description: Provide bankAccount when payoutMethod is bank_account, mobileWallet when it is mobile_wallet.
      required: [fullName, country, currency, payoutMethod]
      properties:
        nickname:
          type: string
          maxLength: 60
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        country:
          $ref: 'common.yaml#/components/schemas/Country'
        currency:
          $ref: 'common.yaml#/components/schemas/Currency'
        relationship:
          type: string
          enum: [family, friend, spouse, parent, child, sibling, business, self, other]
        payoutMethod:
          $ref: 'common.yaml#/components/schemas/PayoutMethod'
        bankAccount:
          type: object
          required: [bankName, accountNumber]
          properties:
            bankName:
              type: string
            bankCode:
              type: string
            accountNumber:
              type: string
              description: Account number or IBAN (Pakistan IBAN is 24 characters, starting PK).
              minLength: 6
              maxLength: 34
              writeOnly: true
        mobileWallet:
          type: object
          required: [provider, walletNumber]
          properties:
            provider:
              type: string
              enum: [jazzcash, easypaisa]
            walletNumber:
              type: string
              pattern: '^\+92[0-9]{10}$'
              writeOnly: true
      oneOf:
        - required: [bankAccount]
          properties:
            payoutMethod:
              const: bank_account
        - required: [mobileWallet]
          properties:
            payoutMethod:
              const: mobile_wallet

    RecipientUpdate:
      type: object
      minProperties: 1
      properties:
        nickname:
          type: string
          maxLength: 60
        relationship:
          type: string
          enum: [family, friend, spouse, parent, child, sibling, business, self, other]
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'

    QuoteRequest:
      type: object
      required: [corridorCode, sendAmount, fundingMethod]
      properties:
        corridorCode:
          $ref: 'common.yaml#/components/schemas/CorridorCode'
        sendAmount:
          $ref: 'common.yaml#/components/schemas/Money'
        fundingMethod:
          $ref: 'common.yaml#/components/schemas/FundingMethod'

    CreateTransferRequest:
      type: object
      required: [quoteId, recipientId, purpose]
      properties:
        quoteId:
          $ref: 'common.yaml#/components/schemas/Uuid'
        recipientId:
          $ref: 'common.yaml#/components/schemas/Uuid'
        purpose:
          $ref: 'common.yaml#/components/schemas/TransferPurpose'
        returnUrl:
          type: string
          format: uri
          description: Where the card form sends the user back after authorising.

    CreateTransferResponse:
      type: object
      required: [transfer, paymentAction]
      properties:
        transfer:
          $ref: '#/components/schemas/Transfer'
        paymentAction:
          $ref: 'common.yaml#/components/schemas/PaymentAction'

    Transfer:
      type: object
      required: [id, reference, status, corridorCode, recipient, fundingMethod, purpose, sendAmount, fee, cardSurcharge,
                 totalCharge, allowedActions, timeline, createdAt, updatedAt]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Uuid'
        reference:
          $ref: 'common.yaml#/components/schemas/TransferReference'
        status:
          $ref: 'common.yaml#/components/schemas/TransferStatus'
        corridorCode:
          $ref: 'common.yaml#/components/schemas/CorridorCode'
        recipient:
          type: object
          required: [id, fullName, payoutMethod, destinationMasked]
          properties:
            id:
              $ref: 'common.yaml#/components/schemas/Uuid'
            fullName:
              type: string
            payoutMethod:
              $ref: 'common.yaml#/components/schemas/PayoutMethod'
            destinationMasked:
              type: string
              examples: ['JazzCash +92 3•• ••• 4521']
        fundingMethod:
          $ref: 'common.yaml#/components/schemas/FundingMethod'
        purpose:
          $ref: 'common.yaml#/components/schemas/TransferPurpose'
        sendAmount:
          $ref: 'common.yaml#/components/schemas/Money'
        fee:
          $ref: 'common.yaml#/components/schemas/Money'
        cardSurcharge:
          $ref: 'common.yaml#/components/schemas/Money'
        totalCharge:
          $ref: 'common.yaml#/components/schemas/Money'
        receiveAmount:
          $ref: 'common.yaml#/components/schemas/Money'
        midRate:
          $ref: 'common.yaml#/components/schemas/Rate'
        offerRate:
          $ref: 'common.yaml#/components/schemas/Rate'
        rateLockExpiresAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        deliveryEstimate:
          type: string
        failure:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
              description: Customer-friendly explanation and next steps.
        cancelReason:
          type: string
        allowedActions:
          type: array
          description: What the customer can do now (drives the UI buttons).
          items:
            type: string
            enum: [authorize_payment, cancel, reconfirm]
        timeline:
          type: array
          description: Status history, oldest first.
          items:
            type: object
            required: [status, at]
            properties:
              status:
                $ref: 'common.yaml#/components/schemas/TransferStatus'
              at:
                $ref: 'common.yaml#/components/schemas/Timestamp'
        createdAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        updatedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        completedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'

    TransferPage:
      type: object
      required: [data, pageInfo]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
        pageInfo:
          $ref: 'common.yaml#/components/schemas/PageInfo'

    KycLimits:
      type: object
      required: [perTransfer, daily, monthly, usedLast24h, usedLast30d]
      properties:
        perTransfer:
          $ref: 'common.yaml#/components/schemas/Money'
        daily:
          $ref: 'common.yaml#/components/schemas/Money'
        monthly:
          $ref: 'common.yaml#/components/schemas/Money'
        usedLast24h:
          $ref: 'common.yaml#/components/schemas/Money'
        usedLast30d:
          $ref: 'common.yaml#/components/schemas/Money'

    KycOverview:
      type: object
      required: [tier, status, canTransact, limits]
      properties:
        tier:
          $ref: 'common.yaml#/components/schemas/KycTier'
        status:
          $ref: 'common.yaml#/components/schemas/KycStatus'
        canTransact:
          type: boolean
        limits:
          $ref: '#/components/schemas/KycLimits'
        nextTier:
          type: object
          required: [tier, requirements, limits]
          properties:
            tier:
              $ref: 'common.yaml#/components/schemas/KycTier'
            requirements:
              type: array
              items:
                type: string
            limits:
              $ref: '#/components/schemas/KycLimits'
        latestSubmission:
          $ref: '#/components/schemas/KycSubmission'

    KycSubmission:
      type: object
      required: [id, tier, status, documentType, requiredDocuments, uploadedDocuments, createdAt]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Uuid'
        userId:
          $ref: 'common.yaml#/components/schemas/Uuid'
        tier:
          $ref: 'common.yaml#/components/schemas/KycTier'
        status:
          $ref: 'common.yaml#/components/schemas/KycStatus'
        documentType:
          type: string
          enum: [drivers_licence, passport, national_id, pr_card]
        documentCountry:
          $ref: 'common.yaml#/components/schemas/Country'
        requiredDocuments:
          type: array
          items:
            type: string
            enum: [id_front, id_back, selfie, proof_of_address, proof_of_income]
        uploadedDocuments:
          type: array
          items:
            type: string
            enum: [id_front, id_back, selfie, proof_of_address, proof_of_income]
        rejectionReason:
          type: string
        submittedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        decidedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        createdAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'

    NotificationPreferences:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            type: object
            required: [eventType, sms, email]
            properties:
              eventType:
                type: string
                enum: [transfer_created, payment_collected, transfer_on_hold, payout_dispatched, transfer_completed,
                       transfer_failed, transfer_cancelled, transfer_refunded, rate_reconfirm_required, kyc_approved,
                       kyc_rejected, security_alert]
              sms:
                type: boolean
              email:
                type: boolean

    Decision:
      type: object
      required: [decision, note]
      properties:
        decision:
          type: string
          enum: [approve, reject]
        note:
          type: string
          minLength: 10
          maxLength: 2000
          description: Mandatory audit note explaining the decision.

    ReviewCase:
      type: object
      required: [id, transferId, userId, reason, rulesTriggered, priority, status, createdAt]
      properties:
        id:
          $ref: 'common.yaml#/components/schemas/Uuid'
        transferId:
          $ref: 'common.yaml#/components/schemas/Uuid'
        transferReference:
          $ref: 'common.yaml#/components/schemas/TransferReference'
        userId:
          $ref: 'common.yaml#/components/schemas/Uuid'
        reason:
          type: string
        rulesTriggered:
          type: array
          items:
            type: string
        fraudScore:
          type: integer
          minimum: 0
          maximum: 100
        priority:
          type: string
          enum: [low, normal, high]
        status:
          type: string
          enum: [open, in_review, approved, rejected]
        assignedTo:
          $ref: 'common.yaml#/components/schemas/Uuid'
        decidedBy:
          $ref: 'common.yaml#/components/schemas/Uuid'
        decisionNote:
          type: string
        createdAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        decidedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'

    ReviewCaseDetail:
      allOf:
        - $ref: '#/components/schemas/ReviewCase'
        - type: object
          required: [screening, transfer, customer]
          properties:
            screening:
              type: object
              required: [decision, fraudScore, events]
              properties:
                decision:
                  type: string
                  enum: [pass, flag, block]
                fraudScore:
                  type: integer
                sanctionsMatches:
                  type: array
                  items:
                    type: object
                    required: [listSource, matchedName, similarity, party]
                    properties:
                      listSource:
                        type: string
                      matchedName:
                        type: string
                      similarity:
                        type: number
                      party:
                        type: string
                        enum: [sender, recipient]
                events:
                  type: array
                  items:
                    type: object
                    required: [ruleCode, result]
                    properties:
                      ruleCode:
                        type: string
                      result:
                        type: string
                      details:
                        type: object
                        additionalProperties: true
            transfer:
              $ref: '#/components/schemas/Transfer'
            customer:
              type: object
              required: [userId, fullName, kycTier, memberSince, transfersLast30d]
              properties:
                userId:
                  $ref: 'common.yaml#/components/schemas/Uuid'
                fullName:
                  type: string
                kycTier:
                  $ref: 'common.yaml#/components/schemas/KycTier'
                memberSince:
                  $ref: 'common.yaml#/components/schemas/Timestamp'
                transfersLast30d:
                  type: integer

    AmlRule:
      type: object
      required: [code, description, enabled, action, scoreWeight, params, updatedAt]
      properties:
        code:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        action:
          type: string
          enum: [block, flag, score, report]
        scoreWeight:
          type: integer
        params:
          type: object
          additionalProperties: true
        updatedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        updatedBy:
          type: string

