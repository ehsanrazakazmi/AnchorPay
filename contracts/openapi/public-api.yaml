          $ref: 'common.yaml#/components/schemas/Uuid'
        userId:
          $ref: 'common.yaml#/components/schemas/Uuid'
        trigger:
          type: string
        status:
          type: string
          enum: [draft, pending_review, approved, filed, rejected]
        payload:
          type: object
          additionalProperties: true
          description: Pre-filled report fields (transaction, parties, reasons for suspicion).
        dueBy:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        reviewedBy:
          $ref: 'common.yaml#/components/schemas/Uuid'
        filedAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'
        filingReference:
          type: string
        createdAt:
          $ref: 'common.yaml#/components/schemas/Timestamp'

    DailySummary:
